apiVersion: v1
kind: Namespace
metadata:
  name: waf-ids-ai-soc
---
apiVersion: v1
kind: Secret
metadata:
  name: waf-ids-ai-soc-admin
  namespace: waf-ids-ai-soc
type: Opaque
stringData:
  ADMIN_TOKEN: replace-with-secret-manager-sync
  EGRESS_PROXY_TOKEN: replace-with-separate-secret-manager-sync
  # Provision this TLS PostgreSQL service and wardnet_runtime role before rollout.
  CONTROL_PLANE_DATABASE_URL: postgres://wardnet:replace-with-secret-manager-sync@wardnet-postgres.database.svc.cluster.local:5432/wardnet?sslmode=require
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf-ids-ai-soc
  namespace: waf-ids-ai-soc
  labels:
    app.kubernetes.io/name: waf-ids-ai-soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: waf-ids-ai-soc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waf-ids-ai-soc
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/contextualwisdomlab/waf-ids-ai-soc:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 5353
              name: egress-dns-udp
              protocol: UDP
            - containerPort: 5353
              name: egress-dns-tcp
              protocol: TCP
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:8080
            - name: DNSBL_ORIGIN
              value: dnsbl.example
            - name: EGRESS_DNS_BIND_ADDR
              value: 0.0.0.0:5353
            - name: EVENT_LIMIT
              value: "1000"
            - name: CONTROL_PLANE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: waf-ids-ai-soc-admin
                  key: CONTROL_PLANE_DATABASE_URL
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: waf-ids-ai-soc-admin
                  key: ADMIN_TOKEN
            - name: EGRESS_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: waf-ids-ai-soc-admin
                  key: EGRESS_PROXY_TOKEN
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: waf-ids-ai-soc
  namespace: waf-ids-ai-soc
spec:
  selector:
    app.kubernetes.io/name: waf-ids-ai-soc
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: egress-dns-udp
      port: 53
      targetPort: egress-dns-udp
      protocol: UDP
    - name: egress-dns-tcp
      port: 53
      targetPort: egress-dns-tcp
      protocol: TCP
