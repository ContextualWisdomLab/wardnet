apiVersion: v1
kind: Namespace
metadata:
  name: wardnet
---
# The administrator Secret is intentionally not distributed with Wardnet.
# For a fresh install, create this Namespace idempotently first, provision
# `wardnet-admin` through the organization's secret-management control
# plane, wait for synchronization, then apply this complete manifest. The
# Deployment has no fallback value and therefore fails closed when the Secret
# or `ADMIN_TOKEN` key is absent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wardnet-state
  namespace: wardnet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardnet
  namespace: wardnet
  labels:
    app.kubernetes.io/name: wardnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wardnet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wardnet
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/contextualwisdomlab/wardnet:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:8080
            - name: DNSBL_ORIGIN
              value: dnsbl.example
            - name: EVENT_LIMIT
              value: "1000"
            - name: WARDNET_STATE_PATH
              value: /var/lib/wardnet/state.json
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wardnet-admin
                  key: ADMIN_TOKEN
                  optional: false
          volumeMounts:
            - name: state
              mountPath: /var/lib/wardnet
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: wardnet-state
---
apiVersion: v1
kind: Service
metadata:
  name: wardnet
  namespace: wardnet
spec:
  selector:
    app.kubernetes.io/name: wardnet
  ports:
    - name: http
      port: 80
      targetPort: http
