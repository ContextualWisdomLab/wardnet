name: Reputation observable URL bounded repair

on:
  pull_request:
    paths:
      - '.github/workflows/reputation-observable-url-repair.yml'

permissions:
  contents: write

concurrency:
  group: reputation-observable-url-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/site-reputation-contract-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded source-only repair
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          git merge-base --is-ancestor dd5a82df0d5588b7f35003fb7447902c10641719 HEAD
          python3 - <<'PY'
          from pathlib import Path

          model = Path('crates/wardnet-reputation-core/src/model.rs')
          text = model.read_text()
          constants_old = '''const MAX_TEXT_BYTES_V1: usize = 1_024;\nconst MAX_LIST_ITEMS_V1: usize = 64;'''
          constants_new = '''const MAX_TEXT_BYTES_V1: usize = 1_024;\nconst MAX_OBSERVABLE_URL_BYTES_V1: usize = 8 * 1_024;\nconst MAX_LIST_ITEMS_V1: usize = 64;'''
          if text.count(constants_old) != 1:
              raise SystemExit('expected shared text-bound constants anchor exactly once')
          text = text.replace(constants_old, constants_new, 1)

          helper_old = '''/// Applies the shared nonblank and byte-bound contract to one required text field.\nfn validate_text(value: &str, field: &'static str) -> Result<(), ContractValidationErrorV1> {\n    if value.trim().is_empty() {\n        return Err(ContractValidationErrorV1::BlankField(field));\n    }\n    if value.len() > MAX_TEXT_BYTES_V1 {\n        return Err(ContractValidationErrorV1::BoundExceeded(field));\n    }\n    Ok(())\n}'''
          helper_new = '''/// Applies a nonblank byte-bound contract to one required text field.\nfn validate_text_with_limit(\n    value: &str,\n    field: &'static str,\n    max_bytes: usize,\n) -> Result<(), ContractValidationErrorV1> {\n    if value.trim().is_empty() {\n        return Err(ContractValidationErrorV1::BlankField(field));\n    }\n    if value.len() > max_bytes {\n        return Err(ContractValidationErrorV1::BoundExceeded(field));\n    }\n    Ok(())\n}\n\n/// Applies the shared nonblank and byte-bound contract to one required text field.\nfn validate_text(value: &str, field: &'static str) -> Result<(), ContractValidationErrorV1> {\n    validate_text_with_limit(value, field, MAX_TEXT_BYTES_V1)\n}'''
          if text.count(helper_old) != 1:
              raise SystemExit('expected shared text validator anchor exactly once')
          text = text.replace(helper_old, helper_new, 1)

          subject_old = '''    fn validate(&self) -> Result<(), ContractValidationErrorV1> {\n        validate_text(&self.value, "subject.value")?;\n        if self.scope == DestinationScopeV1::HostAndSubdomains'''
          subject_new = '''    fn validate(&self) -> Result<(), ContractValidationErrorV1> {\n        let max_bytes = match self.kind {\n            DestinationSubjectKindV1::ObservableUrl => MAX_OBSERVABLE_URL_BYTES_V1,\n            DestinationSubjectKindV1::ExactHost | DestinationSubjectKindV1::ActualAddress => {\n                MAX_TEXT_BYTES_V1\n            }\n        };\n        validate_text_with_limit(&self.value, "subject.value", max_bytes)?;\n        if self.scope == DestinationScopeV1::HostAndSubdomains'''
          if text.count(subject_old) != 1:
              raise SystemExit('expected destination-subject validator anchor exactly once')
          text = text.replace(subject_old, subject_new, 1)
          model.write_text(text)

          workflow = Path('.github/workflows/reputation-observable-url-repair.yml')
          if not workflow.exists():
              raise SystemExit('temporary repair workflow is unexpectedly absent')
          workflow.unlink()
          PY
          test "$(git diff --name-only | sort)" = $'.github/workflows/reputation-observable-url-repair.yml\ncrates/wardnet-reputation-core/src/model.rs'
          git diff --check
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_SOURCE_HEAD"
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add crates/wardnet-reputation-core/src/model.rs .github/workflows/reputation-observable-url-repair.yml
          git commit -m 'fix(reputation): honor observable URL v1 bound'
          git push origin "HEAD:${SOURCE_BRANCH}"
