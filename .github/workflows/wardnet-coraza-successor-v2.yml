name: Wardnet Coraza workspace repair successor

on:
  push:
    branches:
      - codex/coraza-header-enforcement-red-20260917
    paths:
      - .github/workflows/wardnet-coraza-successor-v2.yml

permissions:
  contents: write

concurrency:
  group: wardnet-coraza-successor-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact successor head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 40
          persist-credentials: false

      - name: Guard successor lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "c589e54a8a08446977aa84637d540475e8c00f85"
          test "$(git rev-parse HEAD^^)" = "ccc99a1caf9ae2ab95f38405a6a29bc344a13c07"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "scripts/wardnet-coraza-successor-v2.py"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/wardnet-coraza-successor-v2.yml"
          test "$(git status --porcelain)" = ""

      - name: Re-prove hostile boundaries and verify workspace repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wardnet-coraza-successor-v2.py

      - name: Commit verified production candidate and retire one-shot helpers
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/codex/coraza-header-enforcement-red-20260917 | awk '{print $1}')"
          test "$remote_head" = "$source_head"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib.rs \
            src/proven_engine.rs \
            tests/coraza_live_enforcement.rs \
            tests/coraza_proven_engine_adapter.rs \
            tests/coraza_non_disruptive_detection.rs \
            docs/architecture.md \
            docs/doctoring/in-path-coraza-adapter.md \
            docs/runbooks/operations.md \
            docs/security/threat-model.md
          git rm \
            .github/workflows/wardnet-coraza-fail-closed-repair.yml \
            .github/workflows/wardnet-coraza-successor-repair.yml \
            .github/workflows/wardnet-coraza-successor-v2.yml \
            scripts/wardnet-coraza-bounded-repair.sh \
            scripts/wardnet-coraza-authority-repair.py \
            scripts/wardnet-coraza-successor-repair.py \
            scripts/wardnet-coraza-successor-v2.py
          git diff --cached --check
          git commit -m "fix(security): harden live Coraza authority boundary"

          auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:codex/coraza-header-enforcement-red-20260917
