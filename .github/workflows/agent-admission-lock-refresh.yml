name: Refresh agent admission lockfile

on:
  push:
    branches:
      - feat/agent-artifact-admission
    paths:
      - crates/agent-artifact-admission/Cargo.toml
      - .github/workflows/agent-admission-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/agent-artifact-admission
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Refresh only the manifest-required lockfile edges
        run: cargo check -p wardnet-agent-artifact-admission --tests
      - name: Remove the completed one-shot workflow
        run: rm .github/workflows/agent-admission-lock-refresh.yml
      - name: Commit the lockfile and workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/agent-admission-lock-refresh.yml
          git diff --cached --check
          git commit -m "chore(lock): refresh admission service dependencies"
          git push origin HEAD:feat/agent-artifact-admission
