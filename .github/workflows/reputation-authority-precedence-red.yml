name: Reputation decision reason RED

on:
  pull_request:
    paths:
      - '.github/workflows/reputation-authority-precedence-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: macos-15-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 8e75415a1116691f329040c1d79f09f0b7f4dc8e
          fetch-depth: 1
      - name: Assert exact hostile source
        run: test "$(git rev-parse HEAD)" = "8e75415a1116691f329040c1d79f09f0b7f4dc8e"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run decision reason regressions
        run: cargo test --locked -p wardnet-reputation-core --test decision_binding
