name: Wardnet Coraza hostile-contract validation

on:
  push:
    branches:
      - codex/coraza-header-enforcement-red-20260917
    paths:
      - .github/workflows/wardnet-coraza-fail-closed-repair.yml
      - tests/coraza_live_enforcement.rs
      - src/lib.rs
      - src/coraza_audit.rs
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: wardnet-coraza-hostile-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hostile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Verify formatting and Coraza hostile contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          git diff --check
          cargo test --locked --test coraza_live_enforcement

# This branch previously carried a one-shot workflow that could write an
# interim blanket 503 repair. That is not a valid completion for #434 because
# it would make benign block-mode traffic unavailable and would still provide
# no authoritative Coraza/OWASP CRS decision or evidence. Keep this workflow
# read-only while the Wardnet-owned live proven-engine boundary is repaired.
