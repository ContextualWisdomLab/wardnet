name: Wardnet Coraza bounded repair

on:
  push:
    branches:
      - codex/coraza-header-enforcement-red-20260917
    paths:
      - .github/workflows/wardnet-coraza-fail-closed-repair.yml

permissions:
  contents: write

concurrency:
  group: wardnet-coraza-bounded-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Guard reviewed helper lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "2c3980ca63f2702c1d30b26d36cbba470cb64ea9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/wardnet-coraza-fail-closed-repair.yml"
          test "$(git status --porcelain)" = ""

      - name: Materialize reviewed pre-fix candidate and hostile contract
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/wardnet-coraza-authority-repair.py /tmp/wardnet-coraza-authority-repair.py
          cp scripts/wardnet-coraza-bounded-repair.sh /tmp/wardnet-coraza-bounded-repair.sh
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/wardnet-coraza-authority-repair.py")
          text = path.read_text()
          old = 'if text.count("tests/coraza_live_enforcement.rs") != 2:'
          new = 'if text.count("tests/coraza_live_enforcement.rs") != 3:'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale generated-test seam-count guard")
          text = text.replace(old, new, 1)

          old_generator_path = 'path = Path("scripts/wardnet-coraza-bounded-repair.sh")'
          new_generator_path = 'path = Path("/tmp/wardnet-coraza-bounded-repair.sh")'
          if text.count(old_generator_path) != 1:
              raise SystemExit("expected exactly one tracked generator path seam")
          text = text.replace(old_generator_path, new_generator_path, 1)

          old_stage = """def stage() -> None:
              harden_generator()
              subprocess.run(["bash", "scripts/wardnet-coraza-bounded-repair.sh"], check=True)"""
          new_stage = """def stage() -> None:
              harden_generator()
              subprocess.run(["bash", "/tmp/wardnet-coraza-bounded-repair.sh"], check=True)"""
          if text.count(old_stage) != 1:
              raise SystemExit("expected exactly one stage orchestration seam")
          path.write_text(text.replace(old_stage, new_stage, 1))
          PY
          python /tmp/wardnet-coraza-authority-repair.py stage
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/coraza_live_enforcement.rs")
          text = path.read_text()
          old = '''//! The paired benign-header test is intentionally part of the same contract:
          //! the repair must not turn every block-mode request into a blanket 503. A real
          //! Coraza/CRS adapter must distinguish an attack from ordinary header traffic.'''
          new = '''//! With no proven engine configured, block mode must fail closed even for benign
          //! headers because Wardnet has no authority to infer a clean verdict. The separate
          //! configured-adapter test proves ordinary traffic passes after explicit clean evidence.'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale no-authority module-comment seam")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt
          git diff --check

      - name: Establish hosted non-disruptive detection RED
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test coraza_non_disruptive_detection --no-run
          set +e
          cargo test --locked --test coraza_non_disruptive_detection \
            block_route_does_not_escalate_non_disruptive_coraza_detection_to_block \
            -- --exact --nocapture 2>&1 | tee /tmp/coraza-authority-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "block_route_does_not_escalate_non_disruptive_coraza_detection_to_block ... FAILED" \
            /tmp/coraza-authority-red.log
          grep -F "non-interrupted HTTP 200 Coraza evidence with a CRS message" \
            /tmp/coraza-authority-red.log

      - name: Apply minimum causal disruption-authority fix
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/wardnet-coraza-authority-repair.py fix
          cargo fmt
          git diff --check

      - name: Establish hostile raw client-attribution header RED
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # harden_generator() prepares the intended final boundary before the
          # semantic proof. Restore only the reviewed pre-fix attribution seam
          # in the ephemeral candidate so this step demonstrates the real
          # attacker-controlled forwarding defect before the causal removal.
          source = Path("src/proven_engine.rs")
          source_text = source.read_text()
          fixed_allowlist = '''        "origin",
                  "x-requested-with",
              ];'''
          vulnerable_allowlist = '''        "origin",
                  "x-requested-with",
                  "x-forwarded-for",
                  "x-real-ip",
              ];'''
          if source_text.count(fixed_allowlist) != 1:
              raise SystemExit("expected exactly one hardened raw client-attribution allowlist seam")
          source.write_text(source_text.replace(fixed_allowlist, vulnerable_allowlist, 1))

          path = Path("tests/coraza_proven_engine_adapter.rs")
          text = path.read_text()
          old_headers = '''                .header("authorization", "Bearer must-not-forward")
                          .header("cookie", "session=must-not-forward")
                          .header("x-admin-token", "must-not-forward")'''
          new_headers = '''                .header("authorization", "Bearer must-not-forward")
                          .header("cookie", "session=must-not-forward")
                          .header("x-admin-token", "must-not-forward")
                          .header("x-forwarded-for", "198.51.100.66")
                          .header("x-real-ip", "198.51.100.77")'''
          if text.count(old_headers) != 1:
              raise SystemExit("expected exactly one hostile Coraza request-header seam")
          text = text.replace(old_headers, new_headers, 1)

          old_forbidden = '''    for forbidden in ["authorization", "cookie", "x-admin-token", "proxy-authorization", "x-forwarded-for", "x-real-ip"] {
                  assert!(headers.iter().all(|header| header["name"] != forbidden));
              }'''
          new_forbidden = '''    for forbidden in [
                  "authorization",
                  "cookie",
                  "x-admin-token",
                  "proxy-authorization",
                  "x-forwarded-for",
                  "x-real-ip",
              ] {
                  assert!(
                      headers.iter().all(|header| header["name"] != forbidden),
                      "raw client-attribution header {forbidden} must not cross the Coraza sidecar boundary"
                  );
              }'''
          if text.count(old_forbidden) != 1:
              raise SystemExit("expected exactly one forwarded-header denial seam")
          path.write_text(text.replace(old_forbidden, new_forbidden, 1))
          PY
          cargo fmt
          cargo test --locked --test coraza_proven_engine_adapter --no-run
          set +e
          cargo test --locked --test coraza_proven_engine_adapter \
            block_route_uses_coraza_for_header_only_attack_and_minimizes_credentials \
            -- --exact --nocapture 2>&1 | tee /tmp/coraza-header-minimization-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "block_route_uses_coraza_for_header_only_attack_and_minimizes_credentials ... FAILED" \
            /tmp/coraza-header-minimization-red.log
          grep -F "raw client-attribution header x-forwarded-for must not cross the Coraza sidecar boundary" \
            /tmp/coraza-header-minimization-red.log

      - name: Apply minimum client-attribution header fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/proven_engine.rs")
          text = path.read_text()
          old = '''        "origin",
                  "x-requested-with",
                  "x-forwarded-for",
                  "x-real-ip",
              ];'''
          new = '''        "origin",
                  "x-requested-with",
              ];'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one raw client-attribution header allowlist seam")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt
          git diff --check

      - name: Establish incomplete Coraza header-envelope RED
        shell: bash
        run: |
          set -euo pipefail
          cat >> tests/coraza_proven_engine_adapter.rs <<'RS'

          #[tokio::test]
          async fn block_route_fails_closed_before_sidecar_on_incomplete_header_envelope() {
              let (url, calls, task) = spawn_coraza_sidecar().await;
              let app = app_with_route(
                  "coraza-header-envelope",
                  "/header-envelope",
                  "block",
                  &url,
              )
              .await;
              let oversized = "x".repeat(9_000);
              let response = app
                  .oneshot(
                      Request::builder()
                          .method(Method::GET)
                          .uri("/gateway/header-envelope")
                          .header("user-agent", oversized.as_str())
                          .body(Body::empty())
                          .unwrap(),
                  )
                  .await
                  .unwrap();

              assert_eq!(
                  response.status(),
                  StatusCode::SERVICE_UNAVAILABLE,
                  "an incomplete allowlisted-header projection must fail closed instead of accepting a clean Coraza verdict for a request the sidecar did not inspect in full"
              );
              assert_eq!(
                  calls.lock().await.len(),
                  0,
                  "Wardnet must not ask Coraza to authorize a partial allowlisted-header envelope"
              );
              task.abort();
          }
          RS
          cargo fmt
          cargo test --locked --test coraza_proven_engine_adapter --no-run
          set +e
          cargo test --locked --test coraza_proven_engine_adapter \
            block_route_fails_closed_before_sidecar_on_incomplete_header_envelope \
            -- --exact --nocapture 2>&1 | tee /tmp/coraza-header-envelope-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "block_route_fails_closed_before_sidecar_on_incomplete_header_envelope ... FAILED" \
            /tmp/coraza-header-envelope-red.log
          grep -F "an incomplete allowlisted-header projection must fail closed" \
            /tmp/coraza-header-envelope-red.log

      - name: Apply minimum complete-header-envelope fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("src/proven_engine.rs")
          text = source.read_text()
          old = '''pub(crate) fn engine_forwarded_headers(
              headers: &axum::http::HeaderMap,
          ) -> Vec<(String, String)> {
              let allowlist = [
                  "host",
                  "user-agent",
                  "accept",
                  "content-type",
                  "referer",
                  "origin",
                  "x-requested-with",
              ];
              let mut forwarded = Vec::new();
              let mut total = 0usize;
              for name in allowlist {
                  for value in headers.get_all(name) {
                      if forwarded.len() >= FORWARDED_HEADER_LIMIT {
                          return forwarded;
                      }
                      let Ok(value) = value.to_str() else {
                          continue;
                      };
                      let next = total.saturating_add(name.len()).saturating_add(value.len());
                      if next > FORWARDED_HEADERS_MAX_BYTES {
                          return forwarded;
                      }
                      total = next;
                      forwarded.push((name.to_string(), value.to_string()));
                  }
              }
              forwarded
          }'''
          new = '''pub(crate) fn engine_forwarded_headers(
              headers: &axum::http::HeaderMap,
          ) -> Result<Vec<(String, String)>, String> {
              let allowlist = [
                  "host",
                  "user-agent",
                  "accept",
                  "content-type",
                  "referer",
                  "origin",
                  "x-requested-with",
              ];
              let mut forwarded = Vec::new();
              let mut total = 0usize;
              for name in allowlist {
                  for value in headers.get_all(name) {
                      if forwarded.len() >= FORWARDED_HEADER_LIMIT {
                          return Err(format!(
                              "Coraza request header envelope exceeds {FORWARDED_HEADER_LIMIT} fields"
                          ));
                      }
                      let value = value.to_str().map_err(|_| {
                          format!("Coraza allowlisted request header {name} is not UTF-8")
                      })?;
                      let next = total.saturating_add(name.len()).saturating_add(value.len());
                      if next > FORWARDED_HEADERS_MAX_BYTES {
                          return Err(format!(
                              "Coraza request header envelope exceeds {FORWARDED_HEADERS_MAX_BYTES} bytes"
                          ));
                      }
                      total = next;
                      forwarded.push((name.to_string(), value.to_string()));
                  }
              }
              Ok(forwarded)
          }'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one partial Coraza header-envelope seam")
          text = text.replace(old, new, 1)

          old = '''pub(crate) async fn evaluate_sidecar(
              client: &reqwest::Client,
              config: &ProvenEngineConfig,
              method: &str,
              uri: &str,
              body: &str,
              client_ip: Option<IpAddr>,
              headers: &[(String, String)],
              policy_id: &str,
          ) -> ProvenEngineOutcome {
              let Some(url) = config.sidecar_url() else {
                  return ProvenEngineOutcome::Unavailable {
                      reason: "Coraza proven engine is not configured".to_string(),
                  };
              };
              let payload = sidecar_request_body(method, uri, body, client_ip, headers, policy_id);'''
          new = '''pub(crate) async fn evaluate_sidecar(
              client: &reqwest::Client,
              config: &ProvenEngineConfig,
              method: &str,
              uri: &str,
              body: &str,
              client_ip: Option<IpAddr>,
              headers: &axum::http::HeaderMap,
              policy_id: &str,
          ) -> ProvenEngineOutcome {
              let Some(url) = config.sidecar_url() else {
                  return ProvenEngineOutcome::Unavailable {
                      reason: "Coraza proven engine is not configured".to_string(),
                  };
              };
              let forwarded_headers = match engine_forwarded_headers(headers) {
                  Ok(headers) => headers,
                  Err(reason) => return ProvenEngineOutcome::Unavailable { reason },
              };
              let payload = sidecar_request_body(
                  method,
                  uri,
                  body,
                  client_ip,
                  &forwarded_headers,
                  policy_id,
              );'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Coraza sidecar header-argument seam")
          text = text.replace(old, new, 1)

          old = '''        let forwarded = engine_forwarded_headers(&headers);
                  let names: Vec<&str> = forwarded.iter().map(|(name, _)| name.as_str()).collect();
                  assert_eq!(names, vec!["host", "user-agent"]);

                  let mut oversized = HeaderMap::new();
                  oversized.insert(
                      "user-agent",
                      HeaderValue::from_str(&"x".repeat(FORWARDED_HEADERS_MAX_BYTES + 1)).unwrap(),
                  );
                  assert!(engine_forwarded_headers(&oversized).is_empty());'''
          new = '''        let forwarded = engine_forwarded_headers(&headers).expect("complete bounded headers");
                  let names: Vec<&str> = forwarded.iter().map(|(name, _)| name.as_str()).collect();
                  assert_eq!(names, vec!["host", "user-agent"]);

                  let mut oversized = HeaderMap::new();
                  oversized.insert(
                      "user-agent",
                      HeaderValue::from_str(&"x".repeat(FORWARDED_HEADERS_MAX_BYTES + 1)).unwrap(),
                  );
                  assert!(engine_forwarded_headers(&oversized).is_err());

                  let mut opaque = HeaderMap::new();
                  opaque.insert("user-agent", HeaderValue::from_bytes(&[0x80]).unwrap());
                  assert!(engine_forwarded_headers(&opaque).is_err());'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Coraza header unit-contract seam")
          source.write_text(text.replace(old, new, 1))

          caller = Path("src/lib.rs")
          text = caller.read_text()
          old = '''    let forwarded_headers = proven_engine::engine_forwarded_headers(&headers);
              let mut proven_engine_recorded = false;'''
          new = '''    let mut proven_engine_recorded = false;'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one prebuilt Coraza header-envelope caller seam")
          text = text.replace(old, new, 1)
          old = '''        &forwarded_headers,
                  &route.id,'''
          new = '''        &headers,
                  &route.id,'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Coraza header-envelope call seam")
          caller.write_text(text.replace(old, new, 1))

          doc = Path("docs/doctoring/in-path-coraza-adapter.md")
          text = doc.read_text()
          old = '''Header forwarding is capped at 32 fields / 8 KiB. Sidecar evaluation has a 1.5 s timeout and a 1 MiB response cap.'''
          new = '''Header forwarding is capped at 32 fields / 8 KiB. If any allowlisted value cannot be represented as UTF-8 or the complete allowlisted envelope would exceed either cap, Wardnet records `engine_unavailable` and does not call the sidecar; a partial request projection is never eligible for a clean verdict. Sidecar evaluation has a 1.5 s timeout and a 1 MiB response cap.'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Coraza header-envelope doctoring seam")
          doc.write_text(text.replace(old, new, 1))

          threat = Path("docs/security/threat-model.md")
          text = threat.read_text()
          old = '''forwards a bounded credential-minimized request envelope, and treats an unconfigured engine'''
          new = '''forwards a complete bounded credential-minimized request envelope, rejects unrepresentable or truncated allowlisted headers before sidecar authorization, and treats an unconfigured engine'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Coraza complete-envelope threat-model seam")
          threat.write_text(text.replace(old, new, 1))
          PY
          cargo fmt
          git diff --check

      - name: Verify exact repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          git diff --check
          cargo test --locked --test coraza_live_enforcement
          cargo test --locked --test coraza_proven_engine_adapter
          cargo test --locked --test coraza_non_disruptive_detection
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Commit verified candidate and retire one-shot helpers
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/codex/coraza-header-enforcement-red-20260917 | awk '{print $1}')"
          test "$remote_head" = "$source_head"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib.rs \
            src/proven_engine.rs \
            tests/coraza_live_enforcement.rs \
            tests/coraza_proven_engine_adapter.rs \
            tests/coraza_non_disruptive_detection.rs \
            docs/architecture.md \
            docs/doctoring/in-path-coraza-adapter.md \
            docs/runbooks/operations.md \
            docs/security/threat-model.md
          git rm \
            .github/workflows/wardnet-coraza-fail-closed-repair.yml \
            scripts/wardnet-coraza-bounded-repair.sh \
            scripts/wardnet-coraza-authority-repair.py
          git diff --cached --check
          git commit -m "fix(security): harden live Coraza authority boundary"

          auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:codex/coraza-header-enforcement-red-20260917
