name: Wardnet Coraza bounded repair

on:
  push:
    branches:
      - codex/coraza-header-enforcement-red-20260917
    paths:
      - .github/workflows/wardnet-coraza-fail-closed-repair.yml

permissions:
  contents: write

concurrency:
  group: wardnet-coraza-bounded-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
      - name: Guard reviewed source and helper-only commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "32958d4364bf5bc0aaff5acf21d9733e1f708026"
          test "$(git rev-parse HEAD^^)" = "ef6e6ff2602c4381a29de2f4e1385a9fd3abe895"
          test "$(git rev-parse HEAD^^^)" = "6107f0b7b028269dcecc661d01536d73caab265f"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "scripts/wardnet-coraza-bounded-repair.sh"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/wardnet-coraza-fail-closed-repair.yml"
          test "$(git status --porcelain)" = ""
      - name: Materialize minimum causal repair
        run: bash scripts/wardnet-coraza-bounded-repair.sh
      - name: Verify exact repair candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          git diff --check
          cargo test --locked --test coraza_live_enforcement
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib.rs \
            src/proven_engine.rs \
            tests/coraza_live_enforcement.rs \
            docs/architecture.md \
            docs/doctoring/in-path-coraza-adapter.md \
            docs/runbooks/operations.md \
            docs/security/threat-model.md
          git commit -m "fix(security): consult Coraza on live gateway requests"
          git push origin HEAD:codex/coraza-header-enforcement-red-20260917
