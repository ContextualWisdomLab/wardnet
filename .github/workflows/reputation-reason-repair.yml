name: Reputation reason repair

on:
  push:
    branches:
      - feat/site-reputation-contract-v1

permissions:
  contents: write

concurrency:
  group: wardnet-reputation-reason-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15-arm64
    timeout-minutes: 45
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          remote_head="$(git ls-remote origin refs/heads/feat/site-reputation-contract-v1 | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Prove hostile decision-reason regression is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --locked -p wardnet-reputation-core --test decision_binding
          status=$?
          set -e
          test "${status}" -ne 0

      - name: Apply minimum causal reason-binding repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/wardnet-reputation-core/src/model.rs')
          text = path.read_text()
          old = '''        validate_text(&self.evidence_generation, "evidence_generation")?;\n        validate_text_list(&self.evidence_refs, "evidence_refs")?;\n        let adverse_assessment = matches!(\n'''
          new = '''        validate_text(&self.evidence_generation, "evidence_generation")?;\n        validate_text_list(&self.evidence_refs, "evidence_refs")?;\n        let reason_matches_assessment = match self.assessment {\n            ReputationAssessmentV1::KnownMalicious => {\n                self.reason == DecisionReasonV1::KnownMalicious\n            }\n            ReputationAssessmentV1::Suspicious => self.reason == DecisionReasonV1::Suspicious,\n            ReputationAssessmentV1::Unknown => !matches!(\n                self.reason,\n                DecisionReasonV1::KnownMalicious | DecisionReasonV1::Suspicious\n            ),\n        };\n        if !reason_matches_assessment {\n            return Err(ContractValidationErrorV1::InconsistentAssessmentReason);\n        }\n        let adverse_assessment = matches!(\n'''
          if old not in text:
              raise SystemExit('decision validation insertion point moved')
          text = text.replace(old, new, 1)
          old_error = '''    /// An adverse assessment attempts to serialize as an allow action.\n    UnsafeAdverseAllow,\n'''
          new_error = '''    /// The machine-readable reason contradicts the serialized security assessment.\n    InconsistentAssessmentReason,\n    /// An adverse assessment attempts to serialize as an allow action.\n    UnsafeAdverseAllow,\n'''
          if old_error not in text:
              raise SystemExit('validation error insertion point moved')
          text = text.replace(old_error, new_error, 1)
          path.write_text(text)
          PY

      - name: Verify causal GREEN
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked -p wardnet-reputation-core --test decision_binding
          cargo test --locked -p wardnet-reputation-core
          git diff --check

      - name: Commit only the causal source repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "crates/wardnet-reputation-core/src/model.rs"
          remote_head="$(git ls-remote origin refs/heads/feat/site-reputation-contract-v1 | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wardnet-reputation-core/src/model.rs
          git commit -m "fix(reputation): bind SOC reasons to assessments"
          git push origin HEAD:feat/site-reputation-contract-v1
