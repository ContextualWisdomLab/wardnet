name: Branch PostgreSQL Green Finalization

on:
  push:
    branches:
      - chatgpt/postgres-tenant-context-red

permissions:
  contents: write

concurrency:
  group: wardnet-postgres-tenant-context-finalization
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Materialize the reviewed GREEN delta
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("src/lib.rs")
          text = lib.read_text()
          needle = "mod opencti_import;\nmod runtime_config;"
          replacement = "mod opencti_import;\npub mod postgres_state;\nmod runtime_config;"
          if text.count(needle) != 1:
              raise SystemExit("src/lib.rs module insertion point is not unique")
          lib.write_text(text.replace(needle, replacement, 1))

          state = Path("src/postgres_state.rs")
          text = state.read_text()
          import_needle = "use tokio_postgres::{Client, Config, Host, NoTls, Socket, SslMode};"
          import_replacement = (
              "use tokio_postgres::config::{Host, SslMode};\n"
              "use tokio_postgres::{Client, Config, NoTls, Socket};"
          )
          if text.count(import_needle) != 1:
              raise SystemExit("tokio-postgres config import insertion point is not unique")
          text = text.replace(import_needle, import_replacement, 1)
          public_tls = "    pub async fn connect_with_tls<T>("
          crate_tls = "    pub(crate) async fn connect_with_tls<T>("
          if text.count(public_tls) != 1:
              raise SystemExit("TLS constructor visibility insertion point is not unique")
          text = text.replace(public_tls, crate_tls, 1)
          unused_setting = 'const TENANT_SETTING: &str = "wardnet.tenant_id";\n'
          if text.count(unused_setting) != 1:
              raise SystemExit("unused tenant-setting constant insertion point is not unique")
          state.write_text(text.replace(unused_setting, "", 1))

          test = Path("tests/postgres_tenant_context_pool.rs")
          text = test.read_text()
          import_needle = "use waf_ids_ai_soc::postgres_state::{PostgresTenantPool, TenantId};"
          import_replacement = (
              "use waf_ids_ai_soc::postgres_state::{"
              "PostgresStateResult, PostgresTenantPool, TenantId};"
          )
          if text.count(import_needle) != 1:
              raise SystemExit("tenant-context import insertion point is not unique")
          text = text.replace(import_needle, import_replacement, 1)

          marker = '''#[tokio::test(flavor = "multi_thread", worker_threads = 4)]
          async fn concurrent_pooled_transactions_keep_tenant_context_independent() {'''
          cancellation = r'''#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
          async fn cancelled_transaction_rolls_back_before_connection_reuse() {
              let Some(container) = prepare_database() else {
                  return;
              };
              let dsn = format!(
                  "host=127.0.0.1 port={} user={RUNTIME_PRINCIPAL} dbname=postgres sslmode=disable",
                  container.host_port
              );
              let pool = PostgresTenantPool::connect_loopback_test(&dsn, 1)
                  .await
                  .expect("loopback trust fixture must connect");
              let tenant_a = TenantId::parse("tenant-a").expect("tenant-a must validate");
              let task_pool = pool.clone();
              let (started_tx, started_rx) = tokio::sync::oneshot::channel();

              let task = tokio::spawn(async move {
                  task_pool
                      .with_tenant_transaction(&tenant_a, |tx| {
                          Box::pin(async move {
                              let pid = tx.query_scalar_i64("SELECT pg_backend_pid()::bigint").await?;
                              let _ = started_tx.send(pid);
                              std::future::pending::<PostgresStateResult<()>>().await
                          })
                      })
                      .await
              });

              let active_pid = started_rx
                  .await
                  .expect("transaction must bind before cancellation");
              task.abort();
              let cancelled = task.await.expect_err("aborted transaction task must not complete");
              assert!(cancelled.is_cancelled());

              let after_cancel = pool
                  .probe_unbound_context()
                  .await
                  .expect("cancelled transaction must roll back before the checkout is reused");
              assert_eq!(after_cancel.backend_pid(), active_pid);
              assert_eq!(after_cancel.tenant_id(), None);
          }

          #[tokio::test(flavor = "multi_thread", worker_threads = 4)]
          async fn concurrent_pooled_transactions_keep_tenant_context_independent() {'''
          if text.count(marker) != 1:
              raise SystemExit("cancellation test insertion point is not unique")
          test.write_text(text.replace(marker, cancellation, 1))
          PY

          cargo fmt
          cargo generate-lockfile
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          git diff --check

      - name: Commit exact tested materialization and remove the completed helper
        shell: bash
        run: |
          git rm .github/workflows/branch-postgres-green-materialize.yml
          git add Cargo.lock src/lib.rs src/postgres_state.rs tests/postgres_tenant_context_pool.rs
          git diff --cached --check
          git config user.name "Wardnet commercial-development writer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(state): materialize tenant session boundary"
          git push origin HEAD:chatgpt/postgres-tenant-context-red
