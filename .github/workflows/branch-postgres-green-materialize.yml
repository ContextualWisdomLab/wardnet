name: Branch PostgreSQL Green Materialization

on:
  push:
    branches:
      - chatgpt/postgres-tenant-context-red

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Materialize generated integration delta
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path("src/lib.rs")
          text = lib.read_text()
          needle = "mod opencti_import;\nmod runtime_config;"
          replacement = "mod opencti_import;\npub mod postgres_state;\nmod runtime_config;"
          if text.count(needle) != 1:
              raise SystemExit("src/lib.rs module insertion point is not unique")
          lib.write_text(text.replace(needle, replacement, 1))

          test = Path("tests/postgres_tenant_context_pool.rs")
          text = test.read_text()
          import_needle = "use waf_ids_ai_soc::postgres_state::{PostgresTenantPool, TenantId};"
          import_replacement = (
              "use waf_ids_ai_soc::postgres_state::{"
              "PostgresStateResult, PostgresTenantPool, TenantId};"
          )
          if text.count(import_needle) != 1:
              raise SystemExit("tenant-context import insertion point is not unique")
          text = text.replace(import_needle, import_replacement, 1)

          marker = '''#[tokio::test(flavor = "multi_thread", worker_threads = 4)]
          async fn concurrent_pooled_transactions_keep_tenant_context_independent() {'''
          cancellation = r'''#[tokio::test(flavor = "multi_thread", worker_threads = 2)]
          async fn cancelled_transaction_rolls_back_before_connection_reuse() {
              let Some(container) = prepare_database() else {
                  return;
              };
              let dsn = format!(
                  "host=127.0.0.1 port={} user={RUNTIME_PRINCIPAL} dbname=postgres sslmode=disable",
                  container.host_port
              );
              let pool = PostgresTenantPool::connect_loopback_test(&dsn, 1)
                  .await
                  .expect("loopback trust fixture must connect");
              let tenant_a = TenantId::parse("tenant-a").expect("tenant-a must validate");
              let task_pool = pool.clone();
              let (started_tx, started_rx) = tokio::sync::oneshot::channel();

              let task = tokio::spawn(async move {
                  task_pool
                      .with_tenant_transaction(&tenant_a, |tx| {
                          Box::pin(async move {
                              let pid = tx.query_scalar_i64("SELECT pg_backend_pid()::bigint").await?;
                              let _ = started_tx.send(pid);
                              std::future::pending::<PostgresStateResult<()>>().await
                          })
                      })
                      .await
              });

              let active_pid = started_rx
                  .await
                  .expect("transaction must bind before cancellation");
              task.abort();
              let cancelled = task.await.expect_err("aborted transaction task must not complete");
              assert!(cancelled.is_cancelled());

              let after_cancel = pool
                  .probe_unbound_context()
                  .await
                  .expect("cancelled transaction must roll back before the checkout is reused");
              assert_eq!(after_cancel.backend_pid(), active_pid);
              assert_eq!(after_cancel.tenant_id(), None);
          }

          #[tokio::test(flavor = "multi_thread", worker_threads = 4)]
          async fn concurrent_pooled_transactions_keep_tenant_context_independent() {'''
          if text.count(marker) != 1:
              raise SystemExit("cancellation test insertion point is not unique")
          test.write_text(text.replace(marker, cancellation, 1))
          PY
          cargo fmt
          cargo generate-lockfile
          tar -czf postgres-green-materialized.tgz src/lib.rs Cargo.lock tests/postgres_tenant_context_pool.rs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgres-green-materialized
          path: postgres-green-materialized.tgz
          if-no-files-found: error
          retention-days: 1
