name: Verify and finalize LiteLLM virtual-key guard

# One-shot branch verification. The successful commit deletes this workflow.
on:
  push:
    branches:
      - feat/litellm-virtual-key-ingress-guard
    paths:
      - .github/workflows/repair-litellm-virtual-key-format.yml

permissions:
  contents: write

concurrency:
  group: repair-litellm-virtual-key-format
  cancel-in-progress: true

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/litellm-virtual-key-ingress-guard
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Reconcile source, tests, docs, and anonymization contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def ensure_replacement(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new)
                  path.write_text(text, encoding="utf-8")
                  return
              if new not in text:
                  raise SystemExit(f"{path}: neither expected old nor final source contract found")

          replacements = {
              "https://llm-gateway-dev.hyosungitx.com": "https://gateway.example.invalid",
              "061012345318": "01000000000",
              "Bearer 0610...": "a telephone-shaped synthetic Bearer value",
          }
          allowed_suffixes = {".md", ".json", ".rs", ".toml", ".yml", ".yaml", ".service"}
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix not in allowed_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          proxy = Path("src/litellm_guard_proxy.rs")
          ensure_replacement(proxy, "    upstream_origin: String,\n", "    upstream_policy: &'a str,\n")
          ensure_replacement(
              proxy,
              "        upstream_origin: upstream_origin(&state.upstream_url),\n",
              "        upstream_policy: \"fixed_https_origin\",\n",
          )
          proxy_text = proxy.read_text(encoding="utf-8")
          old_origin_function = (
              "fn upstream_origin(url: &Url) -> String {\n"
              "    url.origin().ascii_serialization()\n"
              "}\n\n"
          )
          if old_origin_function in proxy_text:
              proxy.write_text(proxy_text.replace(old_origin_function, ""), encoding="utf-8")
          elif "fn upstream_origin" in proxy_text:
              raise SystemExit("unexpected upstream_origin implementation remains")

          integration = Path("tests/litellm_virtual_key_guard.rs")
          ensure_replacement(
              integration,
              "    assert!(health_body.contains(\"configuration_version\"));\n",
              "    assert!(health_body.contains(\"configuration_version\"));\n"
              "    assert!(health_body.contains(\"fixed_https_origin\"));\n"
              "    assert!(!health_body.contains(&upstream_address.to_string()));\n",
          )

          ensure_replacement(
              Path("CHANGELOG.md"),
              "- Health endpoint exposing policy, configuration version, upstream origin, and body-limit state without performing a billable model call.\n",
              "- Health endpoint exposing credential policy, configuration version, fixed-upstream policy, and body-limit state without revealing the configured hostname or performing a billable model call.\n",
          )
          ensure_replacement(
              Path("docs/security/litellm-virtual-key-ingress.md"),
              "- upstream origin without credentials, query, or path details;\n",
              "- fixed-upstream policy state without exposing the configured hostname;\n",
          )
          ensure_replacement(
              Path("docs/doctoring/litellm-virtual-key-ingress.md"),
              "https://owasp.org/www-project/application-security-verification-standard/",
              "https://owasp.org/www-project-application-security-verification-standard/",
          )
          PY

          if git grep -n -i -E 'hyosung|0610' -- ':!Cargo.lock'; then
            echo "Organization-specific incident identifier remains in tracked content." >&2
            exit 1
          fi
          if git grep -n 'upstream_origin'; then
            echo "Unauthenticated health payload still exposes an upstream-origin field." >&2
            exit 1
          fi
          git diff --check

      - name: Apply canonical Rust formatting
        run: cargo fmt --all

      - name: Verify complete workspace
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Publish only the verified final state
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/repair-litellm-virtual-key-format.yml
          rm -f -- "$workflow"

          git config user.name "opencode-agent[bot]"
          git config user.email "219766164+opencode-agent[bot]@users.noreply.github.com"

          while IFS= read -r -d '' path; do
            git add -- "$path"
          done < <(git diff --name-only -z -- '*.rs' '*.md' '*.json' '*.toml' '*.yml' '*.yaml' '*.service')
          git add -u -- "$workflow" || true

          if git diff --cached --quiet; then
            echo "No verified finalization changes were produced." >&2
            exit 1
          fi

          git commit -m "test(security): finalize LiteLLM ingress guard evidence"
          git push origin HEAD:feat/litellm-virtual-key-ingress-guard
