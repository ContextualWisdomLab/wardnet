name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install pinned nightly coverage toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-08-06
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov 0.8.7
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Enforce 100% production line and branch coverage
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-06 llvm-cov \
            --locked \
            --branch \
            --all-features \
            --workspace \
            --json \
            --summary-only \
            --output-path coverage.json

          cargo +nightly-2026-08-06 llvm-cov report \
            --branch \
            --text \
            --show-missing-lines \
            --output-path coverage-missing.txt
          cat coverage-missing.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          coverage_policy = {"coverage-run-all-threshold": 1.0}
          if coverage_policy.get('coverage-run-all-threshold', 1.0) < 1.0:
              raise SystemExit(
                  "coverage gate: branch threshold must remain fail-closed at 100%"
              )

          report_path = Path("coverage.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          data = report.get("data")
          if not isinstance(data, list) or not data:
              raise SystemExit("coverage gate: expected a non-empty llvm-cov data list")

          metrics = ("lines", "branches")
          totals = {metric: {"count": 0, "covered": 0} for metric in metrics}
          for export_index, export in enumerate(data):
              if not isinstance(export, dict):
                  raise SystemExit(
                      f"coverage gate: data[{export_index}] is not an object"
                  )
              export_totals = export.get("totals")
              if not isinstance(export_totals, dict):
                  raise SystemExit(
                      f"coverage gate: data[{export_index}].totals is missing"
                  )

              for metric in metrics:
                  summary = export_totals.get(metric)
                  if not isinstance(summary, dict):
                      raise SystemExit(
                          f"coverage gate: data[{export_index}].{metric} is missing"
                      )
                  count = summary.get("count")
                  covered = summary.get("covered")
                  if (
                      not isinstance(count, int)
                      or isinstance(count, bool)
                      or not isinstance(covered, int)
                      or isinstance(covered, bool)
                      or count < 0
                      or covered < 0
                      or covered > count
                  ):
                      raise SystemExit(
                          "coverage gate: "
                          f"data[{export_index}].{metric} has invalid count/covered values"
                      )
                  totals[metric]["count"] += count
                  totals[metric]["covered"] += covered

          failures = []
          for metric in metrics:
              count = totals[metric]["count"]
              covered = totals[metric]["covered"]
              if covered != count:
                  failures.append(f"{metric}: {covered}/{count} covered")

          if failures:
              raise SystemExit("coverage gate failed: " + "; ".join(failures))

          print(
              "coverage gate passed: "
              f"lines={totals['lines']['covered']}/{totals['lines']['count']}, "
              f"branches={totals['branches']['covered']}/{totals['branches']['count']}"
          )
          PY
