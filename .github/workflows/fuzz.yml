name: Fuzz

on:
  # Bounded smoke fuzzing on every PR that touches fuzzable surfaces or the
  # harness. Time budget is capped low to keep CI cost predictable.
  pull_request:
    paths:
      - "src/**"
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  # Longer nightly run for deeper exploration (optional, off the PR critical path).
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wardnet-fuzz-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'schedule' && format('schedule-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    # One runner covers every bounded target; a matrix would consume four org slots.
    runs-on: ubuntu-latest
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '300' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae # nightly
        with:
          toolchain: nightly

      - name: Cache cargo-fuzz build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: cargo-fuzz-0.13.2-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo +nightly install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz bounded targets
        run: |
          exit_code=0
          for target in fuzz_score_request fuzz_appdata_json fuzz_parse_admin_tokens fuzz_dnsbl_zone; do
            cargo +nightly fuzz run "$target" -- \
              -max_total_time="$FUZZ_SECONDS" \
              -rss_limit_mb=2048 || exit_code=$?
          done
          exit "$exit_code"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
