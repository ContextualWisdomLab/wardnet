name: Reputation decision freshness focused verifier

on:
  pull_request:
    paths:
      - "crates/wardnet-reputation-core/**"
      - ".github/workflows/reputation-decision-freshness-focused.yml"

permissions:
  contents: read

concurrency:
  group: wardnet-reputation-decision-freshness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run decision freshness regression
        run: cargo test --locked -p wardnet-reputation-core --test decision_freshness
