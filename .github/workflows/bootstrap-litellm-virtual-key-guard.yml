name: Bootstrap LiteLLM virtual-key guard

on:
  push:
    branches:
      - feat/litellm-virtual-key-ingress-guard

permissions:
  contents: write

concurrency:
  group: bootstrap-litellm-virtual-key-guard
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: feat/litellm-virtual-key-ingress-guard

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Prove the credential-class regression is RED
        shell: bash
        run: |
          set +e
          cargo test --locked --test litellm_virtual_key_guard -- --nocapture 2>&1 | tee red-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "The regression unexpectedly passed before the production guard was wired." >&2
            exit 1
          fi
          if grep -q "could not compile" red-test.log; then
            echo "The RED phase failed to compile instead of reproducing the behavior." >&2
            exit 1
          fi
          grep -q "test litellm_virtual_key_policy_rejects_wrong_credential_class_before_upstream .* FAILED" red-test.log
          rm red-test.log

      - name: Apply the narrow production change
        run: python scripts/apply_litellm_virtual_key_guard.py

      - name: Format
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run complete locked tests
        run: cargo test --locked --workspace

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Remove one-shot implementation machinery
        run: |
          rm scripts/apply_litellm_virtual_key_guard.py
          rm .github/workflows/bootstrap-litellm-virtual-key-guard.yml

      - name: Commit and publish the verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(security): guard LiteLLM virtual-key ingress"
          git push origin HEAD:feat/litellm-virtual-key-ingress-guard
