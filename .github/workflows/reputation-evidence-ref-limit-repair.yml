name: Reputation evidence reference limit causal repair

on:
  pull_request:
    paths:
      - '.github/workflows/reputation-evidence-ref-limit-repair.yml'
      - 'crates/wardnet-reputation-core/src/model.rs'
      - 'crates/wardnet-reputation-core/tests/decision_evidence_ref_limit.rs'

concurrency:
  group: wardnet-reputation-evidence-ref-limit-repair-${{ github.repository }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  red:
    runs-on: macos-15-arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact PR source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Prove declared 32-reference boundary is currently RED
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p wardnet-reputation-core --test decision_evidence_ref_limit decision_envelope_accepts_declared_32_evidence_reference_limit
          set +e
          cargo test --locked -p wardnet-reputation-core --test decision_evidence_ref_limit decision_envelope_rejects_more_than_declared_32_evidence_references 2>&1 | tee /tmp/wardnet-evidence-ref-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'test decision_envelope_rejects_more_than_declared_32_evidence_references ... FAILED' /tmp/wardnet-evidence-ref-red.log

  repair:
    needs: red
    runs-on: macos-15-arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert unchanged exact PR source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$EXPECTED_HEAD"
      - name: Apply bounded causal source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/wardnet-reputation-core/src/model.rs')
          text = path.read_text()

          constant_anchor = 'const MAX_LIST_ITEMS_V1: usize = 64;\n'
          if text.count(constant_anchor) != 1:
              raise SystemExit('expected exactly one generic list-limit anchor')
          text = text.replace(
              constant_anchor,
              constant_anchor + 'const MAX_DECISION_EVIDENCE_REFS_V1: usize = 32;\n',
              1,
          )

          validation_anchor = '        validate_text_list(&self.evidence_refs, "evidence_refs")?;\n'
          if text.count(validation_anchor) != 1:
              raise SystemExit('expected exactly one decision evidence_refs validation anchor')
          text = text.replace(
              validation_anchor,
              '        if self.evidence_refs.len() > MAX_DECISION_EVIDENCE_REFS_V1 {\n'
              '            return Err(ContractValidationErrorV1::BoundExceeded("evidence_refs"));\n'
              '        }\n'
              '        validate_text_list(&self.evidence_refs, "evidence_refs")?;\n',
              1,
          )
          path.write_text(text)
          PY
          rm .github/workflows/reputation-evidence-ref-limit-repair.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/reputation-evidence-ref-limit-repair.yml' 'crates/wardnet-reputation-core/src/model.rs' | sort)"
          test "$changed" = "$expected"
      - name: Commit and non-force push causal repair
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/wardnet-reputation-core/src/model.rs .github/workflows/reputation-evidence-ref-limit-repair.yml
          git commit -m 'fix(reputation): bound decision evidence references'
          git fetch origin "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$EXPECTED_HEAD"
          gh auth setup-git
          git push origin HEAD:"$HEAD_REF"
