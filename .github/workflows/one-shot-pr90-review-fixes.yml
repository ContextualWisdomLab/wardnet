name: One-shot PR 90 review fixes

on:
  push:
    branches:
      - feat/siem-opentelemetry-export

permissions:
  contents: write

concurrency:
  group: one-shot-pr90-review-fixes
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/siem-opentelemetry-export
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Refactor parser and harden RFC contract
        shell: bash
        run: |
          set -euo pipefail
          # This commit contains only the extracted production parser module.
          # It was created against this PR lineage but did not advance the PR ref,
          # so apply it explicitly before wiring the binary/tests to it.
          git cherry-pick d4f2cf69049b76d8d7ba3ec523e7518b2daa4587
          cargo add time@0.3 --features formatting
          python3 - <<'PY'
          from pathlib import Path

          lib_path = Path('src/lib.rs')
          lib = lib_path.read_text()
          if 'pub mod siem_event_input;\n' not in lib:
              marker = 'mod coraza_audit;\n'
              assert marker in lib
              lib = lib.replace(marker, 'pub mod siem_event_input;\n' + marker, 1)
              lib_path.write_text(lib)

          path = Path('src/bin/wardnet-event-exporter.rs')
          source = path.read_text()
          source = source.replace('use serde::Deserialize;\n', '')
          source = source.replace('use std::collections::HashSet;\n', '')
          source = source.replace('use std::net::IpAddr;\n', '')

          serde_import = 'use serde_json::{Value, json};\n'
          assert serde_import in source
          imports = (
              serde_import
              + 'use time::{OffsetDateTime, format_description::well_known::Rfc3339};\n'
              + 'use waf_ids_ai_soc::siem_event_input::{\n'
              + '    NormalizedEvent, checked_time, contains_secret_marker, read_events,\n'
              + '};\n'
          )
          source = source.replace(serde_import, imports, 1)

          constants = '''const MAX_INPUT_BYTES: u64 = 16 * 1024 * 1024;
          const MAX_LINE_BYTES: usize = 1024 * 1024;
          const MAX_OUTPUT_BYTES: usize = 64 * 1024 * 1024;
          const MAX_EVENTS: usize = 100_000;
          const MAX_ACTION_CHARS: usize = 64;
          const MAX_REASON_CHARS: usize = 2_048;
          const MAX_PATH_CHARS: usize = 2_048;
          const MAX_ROUTE_CHARS: usize = 256;
          '''
          assert constants in source
          source = source.replace(constants, 'const MAX_OUTPUT_BYTES: usize = 64 * 1024 * 1024;\n', 1)

          start = source.index('#[derive(Debug, Deserialize)]\nstruct SourceEvent')
          end = source.index('#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nstruct NormalizedSeverity', start)
          source = source[:start] + source[end:]

          start = source.index('fn read_events<R: Read>')
          end = source.index('fn render(options: &Options, events: &[NormalizedEvent])', start)
          source = source[:start] + source[end:]

          old = '        let meta_data = format!("[meta sequenceId=\\"{}\\"]", event.id);\n'
          assert old in source
          source = source.replace(
              old,
              '''        let timestamp = rfc5424_timestamp(event.timestamp_unix)?;
              let meta_data = if event.id <= i32::MAX as u64 {
                  format!("[meta sequenceId=\\"{}\\"]", event.id)
              } else {
                  String::new()
              };
          ''',
              1,
          )

          old = '            "<{priority}>1 - - wardnet - WARDNET_EVENT {origin_data}{meta_data}{trace_data} \\u{feff}{message}\\n"\n'
          assert old in source
          source = source.replace(
              old,
              '            "<{priority}>1 {timestamp} - wardnet - WARDNET_EVENT {origin_data}{meta_data}{trace_data} \\u{feff}{message}\\n"\n',
              1,
          )

          marker = 'fn escape_structured_data(value: &str) -> String {\n'
          assert marker in source
          helper = '''fn rfc5424_timestamp(timestamp_unix: u64) -> Result<String, String> {
              let timestamp = i64::try_from(timestamp_unix)
                  .map_err(|_| "RFC 5424 timestamp exceeds the supported range".to_string())?;
              OffsetDateTime::from_unix_timestamp(timestamp)
                  .map_err(|error| format!("invalid RFC 5424 timestamp: {error}"))?
                  .format(&Rfc3339)
                  .map_err(|error| format!("format RFC 5424 timestamp: {error}"))
          }

          '''
          source = source.replace(marker, helper + marker, 1)
          path.write_text(source)

          adr_path = Path('docs/adr/0001-siem-opentelemetry-event-export.md')
          adr = adr_path.read_text()
          adr = adr.replace(
              '- The RFC 5424 timestamp is the NILVALUE `-` because the current source event stores Unix seconds rather than an RFC 3339 timestamp; the exact source time remains in the JSON message.',
              '- The RFC 5424 header timestamp is deterministically rendered from source Unix seconds as RFC 3339. `meta.sequenceId` is emitted only for event IDs in `1..=2147483647`; larger Wardnet IDs remain in the JSON message.',
          )
          adr_path.write_text(adr)

          runbook_path = Path('docs/runbooks/siem-opentelemetry-export.md')
          runbook = runbook_path.read_text()
          runbook = runbook.replace(
              'The output is one message per line. It uses the RFC-registered `origin` element for Wardnet software and optional client-IP metadata, `meta.sequenceId` for the Wardnet event ID, and the stable OpenTelemetry `OpenTelemetry` element when trace context exists. Remaining Wardnet fields, including the exact source Unix timestamp, are carried in a UTF-8 BOM-prefixed JSON message. No example or unowned IANA Private Enterprise Number is claimed.',
              'The output is one message per line. It renders the source event time as an RFC 3339 header timestamp, uses the RFC-registered `origin` element for Wardnet software and optional client-IP metadata, emits `meta.sequenceId` only for event IDs in RFC 5424\'s `1..=2147483647` range, and uses the stable OpenTelemetry `OpenTelemetry` element when trace context exists. Remaining Wardnet fields, including the exact source Unix timestamp and all Wardnet event IDs, are carried in a UTF-8 BOM-prefixed JSON message. No example or unowned IANA Private Enterprise Number is claimed.',
          )
          runbook_path.write_text(runbook)
          PY
          cargo fmt
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          git diff --check
          git rm .github/workflows/one-shot-pr90-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden SIEM exporter input and RFC contracts'
          git push origin HEAD:feat/siem-opentelemetry-export
