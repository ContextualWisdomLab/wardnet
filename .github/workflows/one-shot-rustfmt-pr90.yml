name: One-shot rustfmt PR 90

on:
  push:
    branches:
      - feat/siem-opentelemetry-export

permissions:
  contents: write

concurrency:
  group: one-shot-rustfmt-pr90
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/siem-opentelemetry-export
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply canonical formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt
          git rm .github/workflows/one-shot-rustfmt-pr90.yml
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes were required.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply canonical rustfmt'
          git push origin HEAD:feat/siem-opentelemetry-export
