    pub dnsbl: Vec<DnsblEntry>,
""",
          )
          replace_exact(
              core,
              """            operator_threat_keys: Vec::new(),
            dnsbl: vec![DnsblEntry {
""",
              """            operator_threat_keys: Vec::new(),
            operator_dnsbl_keys: Vec::new(),
            dnsbl: vec![DnsblEntry {
""",
