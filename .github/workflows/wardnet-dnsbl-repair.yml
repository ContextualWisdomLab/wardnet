name: Wardnet DNSBL ownership repair (temporary)

on:
  push:
    branches:
      - fix/misp-to-ids-fail-closed
    paths:
      - .github/workflows/wardnet-dnsbl-repair.yml

permissions:
  contents: write

concurrency:
  group: wardnet-dnsbl-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Refuse stale-parent execution
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
      - name: Apply shared DNSBL ownership repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new))

          core = "crates/waf-ids-core/src/lib.rs"
          root = "src/lib.rs"

          replace_exact(
              core,
              """    #[serde(default)]
    pub operator_threat_keys: Vec<ThreatIndicatorKey>,
    pub dnsbl: Vec<DnsblEntry>,
""",
