name: Wardnet Coraza bounded repair successor

on:
  push:
    branches:
      - codex/coraza-header-enforcement-red-20260917
    paths:
      - .github/workflows/wardnet-coraza-successor-repair.yml

permissions:
  contents: write

concurrency:
  group: wardnet-coraza-successor-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Guard successor lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "308318691364b2462409fccd1cee2cc32b57c5f9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/wardnet-coraza-successor-repair.yml"
          test "$(git status --porcelain)" = ""

      - name: Re-prove hostile boundaries and verify causal repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wardnet-coraza-successor-repair.py

      - name: Commit verified candidate and retire one-shot helpers
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/codex/coraza-header-enforcement-red-20260917 | awk '{print $1}')"
          test "$remote_head" = "$source_head"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib.rs \
            src/proven_engine.rs \
            tests/coraza_live_enforcement.rs \
            tests/coraza_proven_engine_adapter.rs \
            tests/coraza_non_disruptive_detection.rs \
            docs/architecture.md \
            docs/doctoring/in-path-coraza-adapter.md \
            docs/runbooks/operations.md \
            docs/security/threat-model.md
          git rm \
            .github/workflows/wardnet-coraza-fail-closed-repair.yml \
            .github/workflows/wardnet-coraza-successor-repair.yml \
            scripts/wardnet-coraza-bounded-repair.sh \
            scripts/wardnet-coraza-authority-repair.py \
            scripts/wardnet-coraza-successor-repair.py
          git diff --cached --check
          git commit -m "fix(security): harden live Coraza authority boundary"

          auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 | tr -d '\n')"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:codex/coraza-header-enforcement-red-20260917
