[package]
name = "waf-ids-ai-soc"
version = "0.1.0"
edition = "2024"
description = "Rust-first WAF/IDS/AI SOC gateway with DNSBL and commercial readiness surfaces"
license = "MIT"

[workspace]
members = [".", "crates/waf-ids-core"]
resolver = "3"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
waf-ids-core = { path = "crates/waf-ids-core" }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Property-based testing (MIT OR Apache-2.0); mirrors the cargo-fuzz target for
# parse_admin_tokens so its invariants stay green in primary CI.
proptest = "1"
